[package]
name = "cmini-rs"
version = "0.1.0"
edition = "2021"
default-run = "main"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
fxhash = "0.2.1"
glob = "0.3.2"
happylock = "0.5.0"
indexmap = { version = "2.2.6", features = ["serde"] }
itertools = "0.14.0"
once_cell = "1.21.3"
one-shot-mutex = "0.2.1"
rand = "0.8.5"
rayon = "1.10.0"
regex = "1.10.4"
reqwest = { version = "0.12.20", features = ["blocking", "json"] }
serde = { version = "1.0.197", features = ["rc"] }
serde_json = "1.0.115"
strsim = "0.11.0"
strum = "0.26.2"
strum_macros = "0.26.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-scoped = "0.2.0"
thiserror = "2.0.12"

[dependencies.serenity]
version = "0.11.7"
default-features = false
features = ["cache", "client", "gateway", "model", "rustls_backend"]
